name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n ProxmoxVE/scripts/*.sh

      - name: ShellCheck
        run: shellcheck -S warning ProxmoxVE/scripts/*.sh
